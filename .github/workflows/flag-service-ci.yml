# ============================================
# WORKFLOW: CI Pipeline Flag Service
# ============================================
name: 🔄 Flag Service - CI

on:
  push:
    branches: [main]
    paths:
      - "docker/services/**"
      - "app/**"
      - ".github/workflows/flag-service-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "docker/services/**"
      - "app/**"
      - ".github/workflows/flag-service-ci.yml"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.9"

jobs:
  # ============================================
  # STAGE 1: VALIDAÇÃO (Paralelo)
  # ============================================
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: 🔧 Check Python syntax
        run: python -m compileall -q docker/services/flag-service-main

      - name: 📦 Install dependencies
        working-directory: app
        run: pip install -r requirements.txt
      
      - name: 🧪 Run tests
        working-directory: app
        run: python -m pytest

  lint:
    name: 🔍 Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: 📦 Install Ruff
        run: pip install ruff
      
      - name: 🔍 Run lint
        working-directory: docker/services/flag-service-main
        run: ruff check .
  
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: 🔒 Run security audit
        working-directory: docker/services/flag-service-main
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  # ============================================
  # STAGE 2: BUILD (Depende do Stage 1)
  # ============================================
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: 📦 Install dependencies & build tools
        working-directory: docker/services/flag-service-main
        run: |
          python -m pip install --upgrade pip
          pip install build
          pip install -r requirements.txt
      
      - name: 🏗️ Build application
        working-directory: docker/services/flag-service-main
        run: python -m build
      
      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: docker/services/flag-service-main/dist/
          retention-days: 7
  
  # ============================================
  # STAGE 3: DEPLOY (Depende do Stage 2)
  # ============================================
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 📥 Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ./dist
      
      - name: 🚀 Deploy
        run: |
          echo "📦 Arquivos para deploy:"
          ls -la ./dist
          echo "🚀 Deploying..."