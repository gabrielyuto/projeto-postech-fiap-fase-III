# ============================================
# WORKFLOW: CI Pipeline Flag Service
# ============================================
name: 🔄 Flag Service - CI

on:
  push:
    branches: [main]
    paths:
      - "docker/services/**"
      - "app/**"
      - ".github/workflows/flag-service-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "docker/services/**"
      - "app/**"
      - ".github/workflows/flag-service-ci.yml"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.9"
  AWS_REGION: us-east-1                      # ajuste
  ECR_REPOSITORY: flag-service               # ajuste
  ECR_REGISTRY: <ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com
  BUILD_CONTEXT: docker/services/flag-service-main
  AWS_ROLE_ARN: arn:aws:iam::123456789012:role/github-actions-ecr-push

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # STAGE 1: VALIDAÇÃO (Paralelo)
  # ============================================
  lint:
    name: 🔍 Lint Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docker/services/flag-service-main
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: docker/services/flag-service-main/requirements*.txt
      
      - name: 📦 Install dependences for lint
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🔍 Flake8
        run: flake8 . --count --show-source --statistics

      - name: 🔍 Pylint
        run: pylint --recursive=y --fail-under=8.0 .
  
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: docker/services/flag-service-main/requirements*.txt
      
      # ---------------- SCA ----------------
      - name: 🔒 SCA - pip-audit (informativo)
        working-directory: docker/services/flag-service-main
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: 🛑 SCA - Trivy (bloqueia em CRITICAL)
        uses:  aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: docker/services/flag-service-main
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      # ---------------- SAST ----------------
      - name: 🛑 SAST - Bandit (bloqueia em HIGH)
        working-directory: docker/services/flag-service-main
        run: |
          pip install bandit
          bandit -r . --severity-level high -x ./tests,./.venv

  # ============================================
  # STAGE 2: BUILD (sem credenciais AWS)
  # ============================================
  build:
    name: 🏗️ Build & Push (ECR)
    runs-on: ubuntu-latest
    # needs: [lint, security]
    permissions:
      id-token: write    # OIDC com a AWS
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔑 Configurar credenciais AWS (OIDC)
      # ajustar
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔐 Login no ECR
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🔧 Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏷️ Metadata (tags e labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🏗️ Build (e push fora de PR)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          push: ${{ github.event_name != 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
  
  # ============================================
  # STAGE 3: DEPLOY (Depende do Stage 2)
  # ============================================
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 📥 Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ./dist
      
      - name: 🚀 Deploy
        run: |
          echo "📦 Arquivos para deploy:"
          ls -la ./dist
          echo "🚀 Deploying..."